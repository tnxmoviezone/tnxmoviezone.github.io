<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TNxMovieZone — Watch Movies & Shows</title>
<meta name="description" content="TNxMovieZone — stream movies and shows in HD.">
<link rel="stylesheet" href="css/style.css?v=12">
<link rel="icon" href="logo/logo.png" type="image/png">
</head>
<body>
<div class="aurora-bg" aria-hidden="true"><span></span><span></span><span></span></div>

<header class="header">
  <div class="wrap header-inner">
    <a href="index.html" class="logo" id="siteLogo">TNxMovieZone</a>
    <nav class="nav">
      <a href="index.html" class="active">Home</a>
      <a href="index.html#trending">Trending</a>
      <a href="index.html#latest">Release</a>
    </nav>
    <div class="header-search">
      <span class="icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search movies..." autocomplete="off">
      <div class="search-results" id="searchResults"></div>
    </div>
    <button class="icon-btn" id="themeToggle" title="Toggle theme">🌙</button>
    <button class="icon-btn" id="notifToggle" title="New movie alerts">🔔</button>
    <button class="icon-btn" id="requestBtn" title="Request a movie">💬</button>
    <a class="icon-btn" id="tgJoinBtn" href="#" target="_blank" rel="noopener" title="Join Telegram" style="display:none;text-decoration:none;">✈️</a>
  </div>
</header>

<div class="notice-modal-bg" id="noticeModal" style="display:none;">

<!-- Movie Request Modal -->
<div class="notice-modal-bg" id="requestModal" style="display:none;">
  <div class="notice-modal">
    <button class="notice-close" id="requestClose" aria-label="Close">✕</button>
    <div class="notice-modal-icon">💬</div>
    <h3>Request a Movie</h3>
    <input type="text" id="reqTitle" placeholder="Movie/Series name..." style="width:100%;margin:8px 0;padding:10px;border-radius:8px;border:1px solid var(--glass-border);background:var(--bg-soft);color:var(--text);">
    <input type="text" id="reqYear" placeholder="Year (optional)..." style="width:100%;margin:8px 0;padding:10px;border-radius:8px;border:1px solid var(--glass-border);background:var(--bg-soft);color:var(--text);">
    <button type="button" class="btn btn-grad" id="reqSend" style="width:100%;margin-top:8px;">Send Request</button>
  </div>
</div>
  <div class="notice-modal">
    <button class="notice-close" id="noticeClose" aria-label="Close">✕</button>
    <div class="notice-modal-icon">📢</div>
    <h3>Announcement</h3>
    <p id="noticeText"></p>
  </div>
</div>

<main class="wrap">

<div id="adsBodySlot" style="margin:14px 0;"></div>
  <!-- Hero billboard -->
  <section class="hero" id="hero">
    <div class="hero-bg"><img id="heroBg" src="" alt=""></div>
    <div class="hero-shade"></div>
    <div class="hero-content">
      <span class="hero-badge" id="heroBadge">✨ Featured</span>
      <h1 class="hero-title" id="heroTitle">Loading...</h1>
      <div class="hero-meta" id="heroMeta"></div>
      <p class="hero-desc" id="heroDesc"></p>
      <div class="hero-cast" id="heroCast"></div>
      <div class="hero-actions">
        <a class="btn btn-grad" id="heroWatch" href="#">▶ Watch Now</a>
        <a class="btn btn-ghost" id="heroInfo" href="#">More Info</a>
      </div>
    </div>
    <div class="hero-dots" id="heroDots"></div>
  </section>

  <!-- Category filter chips -->
  <div class="chips" id="catChips"></div>
  <!-- Language filter chips -->
  <div class="chips" id="langChips" style="margin-top:8px;"></div>

  <!-- Full-screen search results -->
  <section class="row-sec" id="searchSec" style="display:none;">
    <div class="row-head">
      <h2 class="row-title">🔍 Search Results <span id="searchCount" style="font-size:.8rem;color:var(--text-faint);"></span></h2>
      <button type="button" class="btn btn-ghost btn-sm" id="searchClose">✕ Clear</button>
    </div>
    <div class="search-grid" id="searchGrid"></div>
  </section>

  <!-- Continue Watching -->
  <section class="row-sec" id="continueSec" style="display:none;">
    <div class="row-head">
      <h2 class="row-title">▶ Continue Watching</h2>
      <button type="button" class="btn btn-ghost btn-sm" id="clearContinue">Clear</button>
    </div>
    <div class="poster-row" id="continueRow"></div>
  </section>

  <!-- Watchlist -->
  <section class="row-sec" id="watchlistSec" style="display:none;">
    <div class="row-head">
      <h2 class="row-title">❤️ My Watchlist</h2>
    </div>
    <div class="poster-row" id="watchlistRow"></div>
  </section>

  <!-- Trending row -->
  <section class="row-sec" id="trending">
    <div class="row-head">
      <h2 class="row-title">Trending Now</h2>
    </div>
    <div class="poster-row" id="trendingRow"></div>
  </section>

  <!-- Latest row -->
  <section class="row-sec" id="latest">
    <div class="row-head">
      <h2 class="row-title">Latest Release</h2>
    </div>
    <div class="poster-row" id="latestRow"></div>
  </section>

  <!-- Category rows injected here -->
  <div id="catRows"></div>
</main>

<footer class="footer">
  <div class="wrap footer-inner">
    <span>© <span id="year"></span> <span id="footName">TNxMovieZone</span>. All rights reserved.</span>
    <span>Made for movie lovers 🍿</span>
  </div>
</footer>

<script src="js/app.js?v=2"></script>
<script>
/* source protection */
(function(){
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'F12' ||
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
        (e.ctrlKey && e.key === 'U')) {
      e.preventDefault();
    }
  });
})();
</script>
<script>
/* 3D tilt + ripple effects (2026-10-19) */
(function(){
  var fine = window.matchMedia('(pointer:fine)').matches;
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (fine && !reduced) {
    document.addEventListener('mousemove', function(e){
      var card = e.target.closest ? e.target.closest('.card') : null;
      document.querySelectorAll('.card.tilting').forEach(function(c){
        if (c !== card) { c.style.transform=''; c.classList.remove('tilting'); }
      });
      if (!card) return;
      var r = card.getBoundingClientRect();
      var x = (e.clientX - r.left)/r.width - .5, y = (e.clientY - r.top)/r.height - .5;
      card.classList.add('tilting');
      card.style.transform = 'perspective(800px) rotateX('+(-y*10).toFixed(1)+'deg) rotateY('+(x*12).toFixed(1)+'deg) translateY(-4px)';
    });
    document.addEventListener('mouseout', function(e){
      var card = e.target.closest ? e.target.closest('.card') : null;
      if (card && !card.contains(e.relatedTarget)) { card.style.transform=''; card.classList.remove('tilting'); }
    });
  }
  if (!reduced) {
    document.addEventListener('click', function(e){
      var btn = e.target.closest ? e.target.closest('.btn') : null;
      if (!btn) return;
      var r = btn.getBoundingClientRect(), d = Math.max(r.width, r.height);
      var s = document.createElement('span');
      s.className='ripple';
      s.style.width = s.style.height = d+'px';
      s.style.left = (e.clientX - r.left - d/2)+'px';
      s.style.top = (e.clientY - r.top - d/2)+'px';
      btn.appendChild(s);
      setTimeout(function(){ s.remove(); }, 650);
    });
  }
})();
</script>
</body>
</html>
