<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie — TNxMovieZone</title>
<link rel="preconnect" href="https://image.tmdb.org">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=16">
<link rel="icon" href="logo/logo.png" type="image/png">
</head>
<body>
<div id="preloader" aria-hidden="true">
  <div class="pre-logo">TNxMovieZone</div>
  <div class="pre-bar"><span></span></div>
</div>
<script>
window.__hidePre=function(){var p=document.getElementById('preloader');if(p){p.classList.add('done');setTimeout(function(){if(p.parentNode)p.parentNode.removeChild(p);},600);}};
window.addEventListener('load',function(){setTimeout(window.__hidePre,350);});
setTimeout(window.__hidePre,4000);
</script>
<div class="aurora-bg" aria-hidden="true"><span></span><span></span><span></span></div>

<header class="header">
  <div class="wrap header-inner">
    <a href="index.html" class="logo" id="siteLogo">TNxMovieZone</a>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="index.html#trending">Trending</a>
    </nav>
    <div class="header-search">
      <span class="icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search movies..." autocomplete="off">
      <div class="search-results" id="searchResults"></div>
    </div>
    <button class="icon-btn" id="themeToggle" title="Toggle theme">🌙</button>
  </div>
</header>

<main class="wrap">
  <section class="detail-hero" id="detailHero">
    <div class="hero-bg"><img id="dBackdrop" src="" alt=""></div>
    <div class="hero-shade"></div>
    <a class="btn btn-ghost btn-sm back-overlay" href="index.html">← Back</a>
  </section>

  <section class="detail-body">
    <div class="detail-top-row">
      <div class="detail-poster-col">
        <div class="detail-poster"><img id="dPoster" src="" alt="Poster"></div>
        <a class="btn btn-grad btn-watch-side" id="dWatch" href="#">▶ Watch Now</a>
        <a class="btn btn-ghost btn-watch-side" id="dTrailer" href="#" target="_blank" rel="noopener" style="display:none;">🎬 Trailer</a>
        <button type="button" class="btn btn-ghost btn-watch-side" id="dShare">📤 Share</button>
        <div id="viewCount" style="font-size:13px;color:var(--text-faint);margin-top:10px;"></div>
        <div id="userRating" style="margin-top:12px;">
          <div style="font-size:13px;color:var(--text-faint);margin-bottom:6px;">Rate this:</div>
          <div id="starsBox" style="font-size:28px;cursor:pointer;letter-spacing:4px;"></div>
          <div id="ratingInfo" style="font-size:12px;color:var(--text-faint);margin-top:4px;"></div>
        </div>
      </div>
      <div class="detail-side-extra"><div class="detail-extra" id="dExtra"></div></div>
    </div>
    <div class="detail-info">
      <h1 class="detail-title" id="dTitle">Loading...</h1>
      <div class="detail-meta" id="dMeta"></div>
      <p class="detail-desc" id="dDesc"></p>
      <div id="dCastSec" style="display:none;margin-top:20px;">
        <h3 class="row-title" style="font-size:1.05rem;">🎭 Cast</h3>
        <div class="cast-grid" id="dCast"></div>
      </div>
      <div class="hero-actions">
      </div>
    </div>
  </section>

  <section class="row-sec">
    <div class="row-head"><h2 class="row-title">You May Also Like</h2></div>
    <div class="poster-row" id="relatedRow"></div>
  </section>
</main>

<footer class="footer">
  <div class="wrap footer-inner">
    <span>© <span id="year"></span> <span id="footName">TNxMovieZone</span>. All rights reserved.</span>
    <span>Made for movie lovers 🍿</span>
  </div>
</footer>

<script src="js/movie.js?v=4"></script>
<script>
/* source protection */
(function(){
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'F12' ||
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
        (e.ctrlKey && e.key === 'U')) {
      e.preventDefault();
    }
  });
})();
</script>
<script>
/* 3D tilt + ripple effects (2026-10-19) */
(function(){
  var fine = window.matchMedia('(pointer:fine)').matches;
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (fine && !reduced) {
    document.addEventListener('mousemove', function(e){
      var card = e.target.closest ? e.target.closest('.card') : null;
      document.querySelectorAll('.card.tilting').forEach(function(c){
        if (c !== card) { c.style.transform=''; c.classList.remove('tilting'); }
      });
      if (!card) return;
      var r = card.getBoundingClientRect();
      var x = (e.clientX - r.left)/r.width - .5, y = (e.clientY - r.top)/r.height - .5;
      card.classList.add('tilting');
      card.style.transform = 'perspective(800px) rotateX('+(-y*10).toFixed(1)+'deg) rotateY('+(x*12).toFixed(1)+'deg) translateY(-4px)';
    });
    document.addEventListener('mouseout', function(e){
      var card = e.target.closest ? e.target.closest('.card') : null;
      if (card && !card.contains(e.relatedTarget)) { card.style.transform=''; card.classList.remove('tilting'); }
    });
  }
  if (!reduced) {
    document.addEventListener('click', function(e){
      var btn = e.target.closest ? e.target.closest('.btn') : null;
      if (!btn) return;
      var r = btn.getBoundingClientRect(), d = Math.max(r.width, r.height);
      var s = document.createElement('span');
      s.className='ripple';
      s.style.width = s.style.height = d+'px';
      s.style.left = (e.clientX - r.left - d/2)+'px';
      s.style.top = (e.clientY - r.top - d/2)+'px';
      btn.appendChild(s);
      setTimeout(function(){ s.remove(); }, 650);
    });
  }
})();
</script>
</body>
</html>
