<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch — TNxMovieZone</title>
<link rel="preconnect" href="https://image.tmdb.org">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=16">
<link rel="icon" href="logo/logo.png" type="image/png">
</head>
<body>
<div id="preloader" aria-hidden="true">
  <div class="pre-logo">TNxMovieZone</div>
  <div class="pre-bar"><span></span></div>
</div>
<script>
window.__hidePre=function(){var p=document.getElementById('preloader');if(p){p.classList.add('done');setTimeout(function(){if(p.parentNode)p.parentNode.removeChild(p);},600);}};
window.addEventListener('load',function(){setTimeout(window.__hidePre,350);});
setTimeout(window.__hidePre,4000);
</script>
<div class="aurora-bg" aria-hidden="true"><span></span><span></span><span></span></div>

<header class="header">
  <div class="wrap header-inner">
    <a href="index.html" class="logo" id="siteLogo">TNxMovieZone</a>
    <nav class="nav">
      <a href="index.html">Home</a>
    </nav>
    <button class="icon-btn" id="themeToggle" title="Toggle theme">🌙</button>
  </div>
</header>

<main class="wrap">
  <div class="player-wrap">
    <h1 class="detail-title" id="wTitle" style="font-size:1.5rem;margin-bottom:14px;">Loading...</h1>

    <div class="server-bar" id="serverBar">
      <span class="lbl">Server</span>
      <div id="serverBtns" style="display:flex;gap:10px;flex-wrap:wrap;"></div>
      <button type="button" class="btn btn-ghost btn-sm" id="reportBtn" style="margin-left:auto;">🚨 Report</button>
    </div>

    <div class="player-frame" id="playerFrame">
      <div class="player-loading" id="playerLoading">
        <div class="spinner"></div>
        <div>Loading player...</div>
      </div>
    </div>

    <div id="epSec" style="display:none;margin-top:20px;">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap;">
        <h3 class="row-title" style="font-size:1.1rem;margin:0;">📺 Episodes</h3>
        <label style="display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--text-dim);cursor:pointer;">
          <input type="checkbox" id="autoNextToggle" checked style="width:16px;height:16px;accent-color:var(--purple);"> ⏭️ Auto-next
        </label>
        <button type="button" class="btn btn-grad btn-sm" id="nextEpBtn" style="display:none;">Next Episode →</button>
        <select id="epRange" style="display:none;padding:7px 10px;border-radius:8px;background:var(--bg-soft);color:var(--text);border:1px solid var(--glass-border);cursor:pointer;font-size:.85rem;"></select>
      </div>
      <div id="epGrid" style="display:flex;gap:8px;flex-wrap:wrap;max-height:220px;overflow-y:auto;padding:4px;"></div>
    </div>

    <div style="display:flex;gap:12px;margin-top:18px;flex-wrap:wrap;">
      <a class="btn btn-ghost btn-sm" id="wBack" href="index.html">← Back</a>
      <a class="btn btn-ghost btn-sm" id="wDetails" href="#">Movie Details</a>
    </div>

    <div id="wCastSec" style="display:none;margin-top:24px;">
      <h3 class="row-title" style="font-size:1.1rem;">🎭 Cast</h3>
      <div id="wCast" style="display:flex;gap:10px;flex-wrap:wrap;"></div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<footer class="footer">
  <div class="wrap footer-inner">
    <span>© <span id="year"></span> <span id="footName">TNxMovieZone</span>. All rights reserved.</span>
    <span>If a server fails, try another 🍿</span>
  </div>
</footer>

<script src="js/watch.js?v=6"></script>
<script>
/* source protection */
(function(){
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'F12' ||
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
        (e.ctrlKey && e.key === 'U')) {
      e.preventDefault();
    }
  });
})();
</script>
<script>
/* 3D tilt + ripple effects (2026-10-19) */
(function(){
  var fine = window.matchMedia('(pointer:fine)').matches;
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (fine && !reduced) {
    document.addEventListener('mousemove', function(e){
      var card = e.target.closest ? e.target.closest('.card') : null;
      document.querySelectorAll('.card.tilting').forEach(function(c){
        if (c !== card) { c.style.transform=''; c.classList.remove('tilting'); }
      });
      if (!card) return;
      var r = card.getBoundingClientRect();
      var x = (e.clientX - r.left)/r.width - .5, y = (e.clientY - r.top)/r.height - .5;
      card.classList.add('tilting');
      card.style.transform = 'perspective(800px) rotateX('+(-y*10).toFixed(1)+'deg) rotateY('+(x*12).toFixed(1)+'deg) translateY(-4px)';
    });
    document.addEventListener('mouseout', function(e){
      var card = e.target.closest ? e.target.closest('.card') : null;
      if (card && !card.contains(e.relatedTarget)) { card.style.transform=''; card.classList.remove('tilting'); }
    });
  }
  if (!reduced) {
    document.addEventListener('click', function(e){
      var btn = e.target.closest ? e.target.closest('.btn') : null;
      if (!btn) return;
      var r = btn.getBoundingClientRect(), d = Math.max(r.width, r.height);
      var s = document.createElement('span');
      s.className='ripple';
      s.style.width = s.style.height = d+'px';
      s.style.left = (e.clientX - r.left - d/2)+'px';
      s.style.top = (e.clientY - r.top - d/2)+'px';
      btn.appendChild(s);
      setTimeout(function(){ s.remove(); }, 650);
    });
  }
})();
</script>
</body>
</html>
